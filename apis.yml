apis:
- name: peopleIX MCP
  description: >-
    The hosted, remote Model Context Protocol server through which peopleIX exposes a
    customer's People Intelligence knowledge layer to agents such as Claude, ChatGPT
    and Copilot. A JSON-RPC POST to https://app.peopleix.com/mcp returns HTTP 401 with
    an RFC 9728 WWW-Authenticate challenge pointing at its own protected-resource
    metadata, which names the resource "peopleIX MCP". Authentication is an OAuth 2.1
    authorization-code flow with mandatory PKCE (S256) and dynamic client registration,
    fronted by Clerk. The tool inventory and input schemas are behind that auth wall and
    were not read; peopleIX publishes no tool list, no OpenAPI, and no developer docs
    for this surface.
  humanURL: https://www.peopleix.com
  baseURL: https://app.peopleix.com/mcp
