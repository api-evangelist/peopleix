aid: peopleix
name: Peopleix
description: >-
  peopleIX is a People Intelligence platform for HR leaders, built and operated by
  peopleIX GmbH in Cologne, Germany (founded 2022). It integrates 100+ HR systems
  (HRIS, ATS, LMS, payroll) and pairs an AI Data Analyst (people analytics — the
  "what") with AI-led conversations across the workforce (conversation intelligence —
  the "why") to answer hard workforce questions in hours rather than months. Each
  engagement leaves a persistent, queryable knowledge layer the customer keeps, which
  is accessible from Claude, ChatGPT, and Copilot via MCP. The service is EU-resident
  end-to-end, GDPR and ISO 27001 compliant, and never trains on customer data. Backed
  by Earlybird, neoteq ventures, ts ventures, and business angels. peopleIX does not
  currently publish a public developer API, OpenAPI, or SDK — this profile captures
  the identity, compliance posture, and machine-readable (llms.txt) surface it does
  publish.
