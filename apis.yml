aid: peopleix
name: Peopleix
description: >-
  peopleIX is a People Intelligence platform for HR leaders, built and operated by
  peopleIX GmbH in Cologne, Germany (founded 2022). It integrates 100+ HR systems
  (HRIS, ATS, LMS, payroll) and pairs an AI Data Analyst (people analytics — the
  "what") with AI-led conversations across the workforce (conversation intelligence —
  the "why") to answer hard workforce questions in hours rather than months. Each
  engagement leaves a persistent, queryable knowledge layer the customer keeps. That
  knowledge layer is exposed to agents through a real, hosted, remote MCP server at
  https://app.peopleix.com/mcp — confirmed live, OAuth 2.1-gated (PKCE S256, dynamic
  client registration, Clerk-backed), and advertised through RFC 8414 and RFC 9728
  discovery documents the application host serves anonymously. peopleIX publishes no
  OpenAPI, no REST developer portal, and no SDK; the MCP endpoint is the entire
  developer-facing surface, and its tool inventory sits behind customer authentication.
  The service is EU-resident end-to-end, GDPR compliant and ISO 27001 certified with a
  Vanta-hosted trust center at https://trust.peopleix.com, and never trains on customer
  data. Backed by Earlybird, neoteq ventures, ts ventures, and business angels.
