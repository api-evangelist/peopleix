method: probed
source: probes of status.peopleix.com and the common hosted-status vendors, plus a docs search of www.peopleix.com and its sitemap
note: >-
  peopleIX publishes no versioning policy, no deprecation policy, no SLA and no status
  page. Recorded because the absence is itself the measurement, and because the status
  probe hit a known false-positive trap worth documenting: peopleix.statuspage.io,
  peopleix.instatus.com and peopleix.betteruptime.com ALL return HTTP 200, but every
  one of them redirects to the vendor's own marketing site (atlassian.com/software/statuspage,
  instatus.com, betterstack.com/uptime) rather than serving a peopleIX status page.
  A naive 200 check would have credited peopleIX with a status page it does not have.
  status.peopleix.com does not resolve at all. NO StatusPage and NO Deprecation
  pointer is wired into apis.yml.
