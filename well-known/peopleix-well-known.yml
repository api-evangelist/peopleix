note: >-
  The marketing host (www.peopleix.com) publishes no /.well-known documents — every
  path returns the site's SPA 404 handler. The APPLICATION host (app.peopleix.com)
  does: it serves RFC 8414 OAuth authorization-server metadata and RFC 9728 OAuth
  protected-resource metadata, both anonymously and both real JSON documents. The
  protected-resource document names the resource "peopleIX MCP", which is how the
  hosted MCP server at https://app.peopleix.com/mcp was confirmed. The authorization
  server is Clerk-backed (revocation_endpoint on clerk.peopleix.com,
  service_documentation on clerk.com). A WellKnown pointer IS emitted for this repo
  because at least one probed path returned a 200 carrying a real document.
